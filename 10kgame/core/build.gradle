plugins {
  id 'java-library'
  id 'eclipse'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if (project.hasProperty('enableGraalNative') && enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

// 1. Ubicar la carpeta de assets correcta dentro del submódulo 10kgame
File assetsFolder = file("$projectDir/../assets")
if (!assetsFolder.exists()) {
  assetsFolder.mkdirs()
}

// 2. Redirigir explícitamente las propiedades de la tarea que valida la ruta
tasks.matching { it.name == 'generateAssetList' }.configureEach { task ->
  // Si la tarea expone la propiedad de directorio de assets (común en plugins de LibGDX)
  if (task.hasProperty('assetsDir')) {
    task.property('assetsDir', assetsFolder)
  } else if (task.hasProperty('inputDir')) {
    task.property('inputDir', assetsFolder)
  }

  // Desactivar la tarea si la carpeta de assets no contiene archivos aún
  task.onlyIf { assetsFolder.exists() && assetsFolder.list().length > 0 }
}
