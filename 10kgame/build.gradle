buildscript {
  repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  idea {
    module {
      outputDir file('build/classes/java/main')
      testOutputDir file('build/classes/java/test')
    }
  }
}

// Configuración común para todos los subproyectos de 10kgame
subprojects {
  apply plugin: 'java-library'

  version = '$projectVersion'
  ext.appName = '10KGame'

  java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    mavenLocal()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://jitpack.io' }
  }

  compileJava {
    options.incremental = true
  }
}

// Tarea de assets registrada en el subproyecto core
def coreProject = findProject(':core') ?: findProject(':10kgame:core')
if (coreProject != null) {
  configure(coreProject) {
    tasks.register('generateAssetList') {
      File assetsFolder = file("${projectDir}/../assets")
      File assetsFile = new File(assetsFolder, "assets.txt")

      if (!assetsFolder.exists()) {
        assetsFolder.mkdirs()
      }

      inputs.dir(assetsFolder).optional()
      outputs.file(assetsFile)

      doLast {
        if (assetsFolder.exists()) {
          if (assetsFile.exists()) {
            assetsFile.delete()
          }
          fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
            assetsFile.append(it + "\n")
          }
        }
      }
    }

    tasks.named('processResources') {
      dependsOn 'generateAssetList'
    }
  }
}

eclipse.project.name = '10KGame-parent'
